<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1220">
<title>حليم ضد ملاك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0e1220; --ring:#161c33; --red:#e5322d; --red-d:#9d1713;
  --blue:#2d6be5; --blue-d:#1a3f91; --gold:#f5b82e; --gold-d:#a87800;
  --paper:#f2ead8; --mute:#9aa3c2; --ok:#2fbf71;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#05070f;font-family:'Cairo',system-ui,sans-serif;color:var(--paper)}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:932px;margin:0 auto;overflow:hidden;background:var(--night);
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media (min-width:500px){#app{margin-top:calc((100dvh - min(100dvh,932px))/2);border-radius:34px;box-shadow:0 0 0 8px #1b2140,0 30px 80px #000}}

/* ---------- ring background ---------- */
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 60% at 0% 0%,rgba(229,50,45,.35),transparent 60%),
             radial-gradient(120% 60% at 100% 100%,rgba(45,107,229,.38),transparent 60%),var(--night)}
.bg .name{position:absolute;font-family:'Bebas Neue',sans-serif;font-size:150px;line-height:.8;letter-spacing:4px;color:transparent;direction:ltr}
.bg .n1{top:6px;left:-6px;-webkit-text-stroke:2px rgba(229,50,45,.55)}
.bg .n2{bottom:6px;right:-6px;-webkit-text-stroke:2px rgba(45,107,229,.6)}
.bg .glove{position:absolute;top:50%;font-size:132px;line-height:1;opacity:.22;filter:drop-shadow(0 0 18px rgba(255,255,255,.2))}
.bg .g1{left:-6px;transform:translateY(-50%) scaleX(-1) rotate(-14deg)}
.bg .g2{right:-6px;transform:translateY(-50%) rotate(-14deg)}
.bg .vs{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue';font-size:40px;color:var(--gold);opacity:.55;letter-spacing:2px}

.view{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ---------- 3D buttons ---------- */
.btn3d{appearance:none;border:0;cursor:pointer;font:900 17px 'Cairo';color:#fff;padding:13px 22px;border-radius:16px;
  background:var(--c,var(--red));box-shadow:0 7px 0 var(--cd,var(--red-d)),0 12px 18px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35);
  transform:translateY(0);transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn3d:active{transform:translateY(6px);box-shadow:0 1px 0 var(--cd,var(--red-d)),0 3px 6px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.3)}
.btn3d.gold{--c:var(--gold);--cd:var(--gold-d);color:#2b1d00;text-shadow:none}
.btn3d.blue{--c:var(--blue);--cd:var(--blue-d)}
.btn3d.green{--c:var(--ok);--cd:#17794a}
.btn3d.grey{--c:#59607e;--cd:#2f344a}
.btn3d.sm{font-size:14px;padding:8px 14px;border-radius:12px;box-shadow:0 5px 0 var(--cd,var(--red-d)),0 8px 12px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.3)}
.btn3d.sm:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd,var(--red-d))}
.btn3d.block{width:100%}

/* ---------- login ---------- */
#login{align-items:center;justify-content:center;padding:24px}
.card{position:relative;width:100%;background:rgba(18,23,44,.86);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:22px}
.card h1{margin:0 0 4px;font-size:28px;font-weight:900}
.card p{margin:0 0 18px;color:var(--mute);font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px;font-weight:700}
input,textarea,select{width:100%;font:600 16px 'Cairo';color:var(--paper);background:#0b0f1f;border:2px solid #2a3157;border-radius:12px;padding:11px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:#59607e}
.err{color:#ff8a85;font-size:13px;min-height:18px;margin-top:8px}

/* ---------- main ---------- */
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;position:relative}
header .who{flex:1;min-width:0}
header .who b{display:block;font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who span{font-size:12px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.busy{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dot.off{background:var(--red);box-shadow:0 0 10px var(--red)}
.fighters{display:flex;gap:8px;padding:4px 16px}
.fighters button{flex:1;appearance:none;border:2px solid transparent;border-radius:14px;padding:9px 6px;font:900 15px 'Cairo';color:var(--paper);background:rgba(18,23,44,.8);cursor:pointer}
.fighters button small{display:block;font-weight:600;font-size:11px;color:var(--mute)}
.fighters button.on.me{border-color:var(--red);background:rgba(229,50,45,.22)}
.fighters button.on.opp{border-color:var(--blue);background:rgba(45,107,229,.25)}
.tabs{display:flex;gap:8px;padding:8px 16px}
.tabs button{flex:1;appearance:none;border:0;border-radius:12px;padding:9px;font:900 15px 'Cairo';color:var(--mute);background:rgba(18,23,44,.8);cursor:pointer}
.tabs button.on{color:#2b1d00;background:var(--gold)}
#list{flex:1;overflow-y:auto;padding:6px 16px 110px;-webkit-overflow-scrolling:touch}
.empty{text-align:center;color:var(--mute);margin-top:60px;line-height:1.9}

.sched{background:rgba(18,23,44,.88);border:2px solid rgba(255,255,255,.1);border-radius:20px;padding:14px;margin-bottom:16px}
.sched.mine{border-color:rgba(229,50,45,.5)}.sched.theirs{border-color:rgba(45,107,229,.55)}
.sh{display:flex;align-items:flex-start;gap:8px}
.sh h3{margin:0;flex:1;font-size:18px;font-weight:900}
.sh small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.bar{height:8px;background:#0b0f1f;border-radius:99px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:99px;transition:width .4s}
.pct{font-size:12px;color:var(--mute);margin-bottom:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #2a3157}
.item .t{min-width:58px;text-align:center;font:700 14px 'Cairo';color:var(--gold);direction:ltr}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:16px}
.item .m span{display:block;font-size:12px;color:var(--mute)}
.item.done .m b{text-decoration:line-through;color:var(--mute)}
.item a{color:#8fb4ff;font-size:12px;margin-inline-end:8px}
.item img{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;margin-top:4px}
.tick{font-size:22px}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn3d{flex:1}
.x{background:none;border:0;color:#59607e;font-size:20px;cursor:pointer;padding:0 4px}

.fab{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);z-index:5;width:calc(100% - 40px)}
.fab:active{transform:translate(-50%,6px)}

/* ---------- sheet modal ---------- */
.modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:#121830;border-radius:26px 26px 0 0;padding:20px 18px 26px;border-top:3px solid var(--gold)}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:900}
.sheet .opt{font-size:12px;color:var(--mute);font-weight:600}
.two{display:flex;gap:10px}.two>*{flex:1}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:50;background:var(--gold);color:#2b1d00;font-weight:900;padding:9px 18px;border-radius:99px;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.preview{width:100%;border-radius:14px;margin-top:10px;display:block}
.fileBtn{display:block;text-align:center;border:2px dashed #3a4274;border-radius:12px;padding:12px;color:var(--mute);font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.fighters .sb{flex:1;border-radius:14px;padding:8px 10px;background:rgba(18,23,44,.85);border:2px solid transparent}
.fighters .sb b{display:block;font-size:15px;font-weight:900}.fighters .sb span{font-size:11px;color:var(--mute)}
.fighters .sb.me{border-color:var(--red)}.fighters .sb.opp{border-color:var(--blue)}
.bar.r i{background:linear-gradient(90deg,var(--red),var(--gold))}.bar.b i{background:linear-gradient(90deg,var(--blue),#6fd3ff)}
.pct b{color:var(--paper)}.lt{color:#ff8a85;font-weight:700}
.dayh{margin:12px 0 2px;font-weight:900;color:var(--gold);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.c{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#0b0f1f;color:var(--mute)}
.c.done{color:var(--ok)}.c.late{color:#ff8a85;background:rgba(229,50,45,.18)}.c.doneLate{color:#ffb347;background:rgba(255,179,71,.15)}
.item .m span a{display:inline-block}
</style>
</head>
<body>
<div id="app">
  <div class="bg">
    <div class="name n1">HALIM</div>
    <div class="name n2">MALAK</div>
    <div class="glove g1">🥊</div><div class="glove g2">🥊</div>
    <div class="vs">VS</div>
  </div>

  <!-- LOGIN -->
  <section id="login" class="view">
    <div class="card">
      <h1>حليم ضد ملاك 🥊</h1>
      <p>مين هيخلّص جدوله الأول؟ ادخل بالاسم والرقم وابدأ التحدي.</p>
      <label for="lName">الاسم</label>
      <input id="lName" autocomplete="name" placeholder="اكتب اسمك">
      <label for="lPhone">رقم الموبايل</label>
      <input id="lPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx">
      <div class="err" id="lErr"></div>
      <button class="btn3d block" id="lGo">ادخل الحلبة</button>
    </div>
  </section>

  <!-- MAIN -->
  <section id="main" class="view hidden">
    <header>
      <div class="who"><b id="meName"></b><span id="syncTxt">متزامن</span></div>
      <div class="dot" id="dot"></div>
      <button class="btn3d sm grey" id="logout">خروج</button>
    </header>
    <div class="fighters" id="fighters"></div>
    <div class="tabs">
      <button data-tab="daily" class="on">جدول يومي</button>
      <button data-tab="weekly">جدول أسبوعي</button>
    </div>
    <div id="list"></div>
    <button class="btn3d gold fab" id="newSched">＋ إنشاء جدول</button>
  </section>

  <div id="modalHost"></div>
</div>

<script>
/* ====== حط رابط Web app بتاع Google Apps Script هنا ====== */
const _d=["MUNfR3pi", "ZjVrdGY5", "cHR0aA==", "Y3MvLzpz", "eHg5dWl1", "V2FiY0Ez", "Zy50cGly", "aS1lZHBk", "Y2V4ZS9V", "Q09Ibkxm", "SmVTWl84", "YW0vbW9j", "RU9ybXlR", "cy9zb3Jj", "LmVsZ29v", "MlREN2Vm", "Y3lmS0Ev", "OXFLaXFU", "NjNjX3RH"],_o=[8, 15, 1, 7, 17, 10, 5, 4, 12, 9, 18, 0, 16, 13, 11, 14, 6, 3, 2];
const API_URL=(()=>{try{return atob(_o.map(i=>_d[i]).join('')).split('').reverse().join('')}catch(e){return ''}})();
/* ========================================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '';

let me = JSON.parse(localStorage.getItem('hm_me') || 'null');
let db = { users: [], schedules: [], items: [], joins: [], progress: [] };
let tab = 'daily';
let started = false;

async function api(action, data = {}) {
  if (!API_URL) throw new Error('رابط الـ Web app مش موجود');
  setDot('busy');
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...data }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'خطأ');
    setDot('ok');
    return j.data;
  } catch (e) { setDot('off'); throw e; }
}
function setDot(s) {
  const d = $('#dot'); if (!d) return;
  d.className = 'dot' + (s === 'busy' ? ' busy' : s === 'off' ? ' off' : '');
  $('#syncTxt').textContent = s === 'busy' ? 'بيتزامن…' : s === 'off' ? 'مفيش اتصال' : 'متزامن';
}
function toast(t) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  $('#app').appendChild(el); setTimeout(() => el.remove(), 2200);
}

/* ---------- login ---------- */
$('#lGo').onclick = async () => {
  const name = $('#lName').value.trim(), phone = $('#lPhone').value.trim();
  if (!name || !phone) { $('#lErr').textContent = 'اكتب الاسم والرقم'; return; }
  $('#lErr').textContent = ''; $('#lGo').disabled = true;
  try {
    me = await api('login', { name, phone });
    localStorage.setItem('hm_me', JSON.stringify(me));
    enter();
  } catch (e) { $('#lErr').textContent = e.message; }
  $('#lGo').disabled = false;
};
$('#logout').onclick = () => { localStorage.removeItem('hm_me'); me = null; location.reload(); };

function enter() {
  $('#login').classList.add('hidden'); $('#main').classList.remove('hidden');
  $('#meName').textContent = me.name;
  refresh();
  if (!started) {
    started = true;
    setInterval(() => { if (!document.querySelector('.modal')) refresh(); }, 15000);
    setInterval(() => { if (!document.querySelector('.modal')) render(); }, 60000); // علشان "متأخر" يظهر في وقته
  }
}
async function refresh() {
  try { db = await api('getAll'); render(); } catch (e) { /* offline: keep what we have */ }
}

/* ---------- logic: join / due / late ---------- */
const opp = () => db.users.find(u => u.id !== me.id);
const uname = id => (db.users.find(u => u.id === id) || {}).name || '؟';
const joined = (sid, uid) => db.joins.some(j => j.scheduleId === sid && j.userId === uid);
const prog = (iid, uid) => db.progress.find(p => p.itemId === iid && p.userId === uid);
function dateOf(s, off) {
  const m = /^(\d+)-(\d+)-(\d+)$/.exec(s.dateOrWeek || '');
  const n = new Date();
  const [y, mo, d] = m ? [+m[1], +m[2], +m[3]] : [n.getFullYear(), n.getMonth() + 1, n.getDate()];
  return new Date(y, mo - 1, d + (+off || 0));
}
function dueOf(s, i) {
  const d = dateOf(s, s.type === 'weekly' ? i.day : 0);
  const m = /^(\d+):(\d+)/.exec(i.time || '');
  if (m) d.setHours(+m[1], +m[2], 0, 0); else d.setHours(23, 59, 59, 0);
  return d;
}
// done | doneLate | late | pending
function statusOf(s, i, uid) {
  const p = prog(i.id, uid), due = dueOf(s, i);
  if (p && p.done) return new Date(p.doneAt) > due ? 'doneLate' : 'done';
  return new Date() > due ? 'late' : 'pending';
}
const ICON = { done: '✅', doneLate: '⚠️', late: '⏰', pending: '⏳' };
const TXT = { done: 'خلّص', doneLate: 'سلّم متأخر', late: 'متأخر', pending: 'لسه' };
const dayName = (s, i) => dateOf(s, i.day).toLocaleDateString('ar-EG', { weekday: 'long' });

function stats(uid) {
  let done = 0, late = 0;
  db.schedules.forEach(s => {
    if (!joined(s.id, uid)) return;
    db.items.filter(i => i.scheduleId === s.id).forEach(i => {
      const st = statusOf(s, i, uid);
      if (st === 'done' || st === 'doneLate') done++;
      if (st === 'late' || st === 'doneLate') late++;
    });
  });
  return { done, late };
}

/* ---------- render ---------- */
function render() {
  const o = opp(), a = stats(me.id), b = o ? stats(o.id) : null;
  $('#fighters').innerHTML =
    `<div class="sb me"><b>${esc(me.name)}</b><span>خلّص ${a.done} · متأخر ${a.late}</span></div>` +
    (o ? `<div class="sb opp"><b>${esc(o.name)}</b><span>خلّص ${b.done} · متأخر ${b.late}</span></div>`
       : `<div class="sb opp"><b>مستني الخصم…</b><span>لسه محدش دخل</span></div>`);

  const scs = db.schedules.filter(s => s.type === tab).reverse();
  if (!scs.length) {
    $('#list').innerHTML = `<div class="empty">مفيش جداول لسه.<br>اضغط «إنشاء جدول» — وهيظهر للاتنين.</div>`;
    return;
  }
  $('#list').innerHTML = scs.map(s => {
    const its = db.items.filter(i => i.scheduleId === s.id)
      .sort((x, y) => (s.type === 'weekly' ? (+x.day - +y.day) : 0) || x.time.localeCompare(y.time));
    const mine = s.userId === me.id, inMe = joined(s.id, me.id);
    const bars = db.users.filter(u => joined(s.id, u.id)).map(u => {
      const dn = its.filter(i => { const t = statusOf(s, i, u.id); return t === 'done' || t === 'doneLate'; }).length;
      const lt = its.filter(i => { const t = statusOf(s, i, u.id); return t === 'late' || t === 'doneLate'; }).length;
      const pc = its.length ? Math.round(dn / its.length * 100) : 0;
      return `<div class="pct"><b>${esc(u.name)}</b> — ${dn}/${its.length}${lt ? ` · <span class="lt">متأخر ${lt}</span>` : ''}</div>
              <div class="bar ${u.id === me.id ? 'r' : 'b'}"><i style="width:${pc}%"></i></div>`;
    }).join('');
    let lastDay = null;
    const rowsHtml = its.map(i => {
      let head = '';
      if (s.type === 'weekly' && i.day !== lastDay) { lastDay = i.day; head = `<div class="dayh">${esc(dayName(s, i))}</div>`; }
      const o2 = opp(), sm = inMe ? statusOf(s, i, me.id) : null;
      const so = o2 && joined(s.id, o2.id) ? statusOf(s, i, o2.id) : null;
      const pm = prog(i.id, me.id), po = o2 ? prog(i.id, o2.id) : null;
      const proofs = [pm, po].filter(Boolean).map(p => (safeUrl(p.proofLink) ? `<a href="${esc(p.proofLink)}" target="_blank" rel="noopener">📎 إثبات ${esc(uname(p.userId))}</a>` : '') +
        (safeUrl(p.proofImg) ? `<a href="${esc(p.proofImg)}" target="_blank" rel="noopener"><img src="${esc(p.proofImg)}" alt="" loading="lazy"></a>` : '')).join('');
      return head + `<div class="item ${sm === 'done' || sm === 'doneLate' ? 'done' : ''}">
        <div class="t">${esc(i.time) || '--:--'}</div>
        <div class="m"><b>${esc(i.subject)}</b>
          ${i.lesson ? `<span>${esc(i.lesson)}</span>` : ''}
          <span class="chips">${sm ? `<em class="c ${sm}">أنا: ${ICON[sm]} ${TXT[sm]}</em>` : ''}${so ? `<em class="c ${so}">${esc(o2.name)}: ${ICON[so]}</em>` : ''}</span>
          ${safeUrl(i.link) ? `<span><a href="${esc(i.link)}" target="_blank" rel="noopener">🔗 المحاضرة</a></span>` : ''}
          ${proofs ? `<span>${proofs}</span>` : ''}</div>
        ${inMe ? `<button class="btn3d sm ${sm === 'done' || sm === 'doneLate' ? 'grey' : 'green'}" data-act="${sm === 'done' || sm === 'doneLate' ? 'undo' : 'done'}" data-id="${i.id}">${sm === 'done' || sm === 'doneLate' ? 'تراجع' : 'خلصت'}</button>` : ''}
        ${mine ? `<button class="x" data-act="delItem" data-id="${i.id}" aria-label="حذف المادة">✕</button>` : ''}
      </div>`;
    }).join('');
    return `<div class="sched ${inMe ? 'mine' : 'theirs'}">
      <div class="sh"><h3>${esc(s.title)}<small>${esc(s.dateOrWeek)} — عمله ${esc(uname(s.userId))}</small></h3>
        ${mine ? `<button class="x" data-act="delSched" data-id="${s.id}" aria-label="حذف الجدول">🗑</button>` : ''}</div>
      ${bars}
      ${rowsHtml || '<div class="pct">لسه مفيش مواد في الجدول ده</div>'}
      <div class="row">
        ${inMe ? '' : `<button class="btn3d gold" data-act="start" data-id="${s.id}">▶ ابدأ الجدول</button>`}
        ${mine ? `<button class="btn3d sm blue" data-act="addItem" data-id="${s.id}">＋ مادة</button>` : ''}
        <button class="btn3d sm ${inMe ? 'gold' : 'grey'}" data-act="export" data-id="${s.id}">🖼 صورة</button>
      </div>
    </div>`;
  }).join('');
}

document.addEventListener('click', e => {
  const t = e.target.closest('.tabs button'); if (t) {
    tab = t.dataset.tab; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === t)); render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id, act = a.dataset.act;
  if (act === 'start') startSchedule(id);
  else if (act === 'addItem') openItem(id);
  else if (act === 'done') openDone(id);
  else if (act === 'undo') setDone(id, false).catch(() => {});
  else if (act === 'delItem') { if (confirm('تمسح المادة؟')) del('deleteItem', { id }, () => { db.items = db.items.filter(i => i.id !== id); db.progress = db.progress.filter(p => p.itemId !== id); }); }
  else if (act === 'delSched') { if (confirm('تمسح الجدول بكل مواده؟ هيتمسح عند الاتنين.')) del('deleteSchedule', { id }, () => {
    const ids = db.items.filter(i => i.scheduleId === id).map(i => i.id);
    db.schedules = db.schedules.filter(s => s.id !== id); db.items = db.items.filter(i => i.scheduleId !== id);
    db.joins = db.joins.filter(j => j.scheduleId !== id); db.progress = db.progress.filter(p => ids.indexOf(p.itemId) < 0); }); }
  else if (act === 'export') exportImage(id);
});
$('#newSched').onclick = openSched;

async function startSchedule(sid) {
  db.joins.push({ scheduleId: sid, userId: me.id, startedAt: new Date().toISOString() }); render();
  try { await api('startSchedule', { userId: me.id, scheduleId: sid }); toast('يلا ابدأ! 🥊'); }
  catch (e) { db.joins = db.joins.filter(j => !(j.scheduleId === sid && j.userId === me.id)); render(); toast(e.message); }
}
async function del(action, data, local) {
  local(); render();
  try { await api(action, { ...data, userId: me.id }); } catch (e) { toast(e.message); refresh(); }
}

/* ---------- modals ---------- */
function modal(html) {
  const h = $('#modalHost'); h.innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`;
  h.querySelector('.modal').addEventListener('click', e => { if (e.target.classList.contains('modal')) closeModal(); });
  return h.querySelector('.sheet');
}
function closeModal() { $('#modalHost').innerHTML = ''; }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function openSched() {
  const s = modal(`<h2>جدول جديد</h2>
    <div class="opt">هيظهر لحليم وملاك الاتنين</div>
    <label>اسم الجدول</label><input id="sTitle" placeholder="مثال: مذاكرة الفيزياء">
    <div class="two"><div><label>النوع</label><select id="sType"><option value="daily">يومي</option><option value="weekly">أسبوعي</option></select></div>
    <div><label id="sDl">التاريخ</label><input id="sDate" type="date" value="${today()}"></div></div>
    <div class="err" id="sErr"></div>
    <button class="btn3d gold block" id="sOk" style="margin-top:12px">إنشاء</button>`);
  s.querySelector('#sType').value = tab;
  const upd = () => s.querySelector('#sDl').textContent = s.querySelector('#sType').value === 'weekly' ? 'بداية الأسبوع' : 'التاريخ';
  s.querySelector('#sType').onchange = upd; upd();
  s.querySelector('#sOk').onclick = async () => {
    const title = s.querySelector('#sTitle').value.trim();
    if (!title) { s.querySelector('#sErr').textContent = 'اكتب اسم الجدول'; return; }
    const type = s.querySelector('#sType').value, dateOrWeek = s.querySelector('#sDate').value;
    s.querySelector('#sOk').disabled = true;
    try {
      const r = await api('addSchedule', { userId: me.id, title, type, dateOrWeek });
      db.schedules.push({ id: r.id, userId: me.id, title, type, dateOrWeek });
      tab = type; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
      closeModal(); render();
    } catch (e) { s.querySelector('#sErr').textContent = e.message; s.querySelector('#sOk').disabled = false; }
  };
}

function openItem(scheduleId) {
  const sc = db.schedules.find(x => x.id === scheduleId);
  const dayOpts = [0, 1, 2, 3, 4, 5, 6].map(k => `<option value="${k}">${esc(dateOf(sc, k).toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'numeric' }))}</option>`).join('');
  const s = modal(`<h2>إضافة مادة</h2>
    <label>المادة</label><input id="iSub" placeholder="مثال: كيمياء">
    ${sc.type === 'weekly' ? `<label>اليوم</label><select id="iDay">${dayOpts}</select>` : ''}
    <div class="two"><div><label>الساعة (آخر ميعاد للتسليم)</label><input id="iTime" type="time"></div>
    <div><label>اسم الدرس <span class="opt">(اختياري)</span></label><input id="iLes" placeholder="الدرس الثالث"></div></div>
    <label>لينك المحاضرة <span class="opt">(اختياري)</span></label><input id="iLink" type="url" inputmode="url" placeholder="https://…" style="direction:ltr;text-align:left">
    <div class="err" id="iErr"></div>
    <button class="btn3d gold block" id="iOk" style="margin-top:12px">حفظ المادة</button>`);
  s.querySelector('#iOk').onclick = async () => {
    const subject = s.querySelector('#iSub').value.trim();
    if (!subject) { s.querySelector('#iErr').textContent = 'اكتب اسم المادة'; return; }
    const time = s.querySelector('#iTime').value, lesson = s.querySelector('#iLes').value.trim(), link = s.querySelector('#iLink').value.trim();
    const day = s.querySelector('#iDay') ? s.querySelector('#iDay').value : '0';
    if (link && !safeUrl(link)) { s.querySelector('#iErr').textContent = 'اللينك لازم يبدأ بـ https://'; return; }
    s.querySelector('#iOk').disabled = true;
    try {
      const r = await api('addItem', { userId: me.id, scheduleId, subject, day, time, lesson, link });
      db.items.push({ id: r.id, scheduleId, userId: me.id, subject, day, time, lesson, link });
      closeModal(); render();
    } catch (e) { s.querySelector('#iErr').textContent = e.message; s.querySelector('#iOk').disabled = false; }
  };
}

function openDone(id) {
  let img = null;
  const it = db.items.find(i => i.id === id), sc = db.schedules.find(x => x.id === it.scheduleId);
  const late = statusOf(sc, it, me.id) === 'late';
  const s = modal(`<h2>خلصت ${esc(it.subject)}؟ 💪</h2>
    ${late ? '<div class="err">⏰ الميعاد عدّى — هتتسجل «سلّم متأخر».</div>' : ''}
    <div class="opt">كل اللي تحت اختياري</div>
    <label>لينك المحاضرة اللي سمعتها</label><input id="dLink" type="url" inputmode="url" placeholder="https://…" style="direction:ltr;text-align:left">
    <label>صورة اللي ذاكرته</label>
    <label class="fileBtn" for="dFile">📷 اختار صورة</label><input id="dFile" type="file" accept="image/*" class="hidden">
    <img id="dPrev" class="preview hidden" alt="">
    <label>ملاحظة</label><input id="dNote" placeholder="اختياري">
    <div class="err" id="dErr"></div>
    <button class="btn3d green block" id="dOk" style="margin-top:12px">تأكيد: خلصت ✓</button>`);
  s.querySelector('#dFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    img = await shrink(f); const p = s.querySelector('#dPrev'); p.src = img; p.classList.remove('hidden');
  };
  s.querySelector('#dOk').onclick = async () => {
    const proofLink = s.querySelector('#dLink').value.trim();
    if (proofLink && !safeUrl(proofLink)) { s.querySelector('#dErr').textContent = 'اللينك لازم يبدأ بـ https://'; return; }
    s.querySelector('#dOk').disabled = true; s.querySelector('#dOk').textContent = 'بيتحفظ…';
    try { await setDone(id, true, { proofLink, note: s.querySelector('#dNote').value.trim(), imageBase64: img }); closeModal(); toast('عاش! اتسجلت ✅'); }
    catch (e) { s.querySelector('#dErr').textContent = e.message; s.querySelector('#dOk').disabled = false; s.querySelector('#dOk').textContent = 'تأكيد: خلصت ✓'; }
  };
}

async function setDone(id, done, extra = {}) {
  let p = prog(id, me.id); const old = p ? { ...p } : null;
  if (!p) { p = { itemId: id, userId: me.id, done: false, doneAt: '', proofLink: '', proofImg: '', note: '' }; db.progress.push(p); }
  p.done = done; p.doneAt = done ? new Date().toISOString() : ''; render();
  try {
    const r = await api('setDone', { userId: me.id, itemId: id, done, ...extra });
    if (r && r.proofImg) p.proofImg = r.proofImg;
    if (r && r.doneAt) p.doneAt = r.doneAt;
    if (extra.proofLink) p.proofLink = extra.proofLink;
    render();
  } catch (e) {
    if (old) Object.assign(p, old); else db.progress = db.progress.filter(x => x !== p);
    render(); toast(e.message); throw e;
  }
}

function shrink(file, max = 1000) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .75)); }; im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- export schedule as image ---------- */
async function exportImage(sid) {
  const s = db.schedules.find(x => x.id === sid);
  const its = db.items.filter(i => i.scheduleId === sid)
    .sort((a, b) => (s.type === 'weekly' ? (+a.day - +b.day) : 0) || a.time.localeCompare(b.time));
  const inMe = joined(sid, me.id);
  try { await document.fonts.load('900 40px Cairo'); await document.fonts.load('80px "Bebas Neue"'); } catch (e) {}
  const W = 1080, rowH = its.length > 9 ? 96 : 118, tableTop = 520;
  const H = Math.max(1920, tableTop + its.length * rowH + 360);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');

  g.fillStyle = '#0e1220'; g.fillRect(0, 0, W, H);
  let gr = g.createRadialGradient(0, 0, 0, 0, 0, 1300); gr.addColorStop(0, 'rgba(229,50,45,.55)'); gr.addColorStop(1, 'rgba(229,50,45,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  gr = g.createRadialGradient(W, H, 0, W, H, 1500); gr.addColorStop(0, 'rgba(45,107,229,.6)'); gr.addColorStop(1, 'rgba(45,107,229,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

  g.font = '300px "Bebas Neue", Impact, sans-serif'; g.textAlign = 'center'; g.lineWidth = 5; g.direction = 'ltr';
  g.save(); g.translate(150, H / 2); g.rotate(-Math.PI / 2); g.strokeStyle = 'rgba(229,50,45,.8)'; g.strokeText('HALIM', 0, 100); g.restore();
  g.save(); g.translate(W - 150, H / 2); g.rotate(Math.PI / 2); g.strokeStyle = 'rgba(45,107,229,.9)'; g.strokeText('MALAK', 0, 100); g.restore();

  g.font = '520px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textBaseline = 'middle'; g.globalAlpha = .32;
  g.save(); g.translate(250, H / 2); g.scale(-1, 1); g.fillText('🥊', 0, 0); g.restore();
  g.save(); g.translate(W - 250, H / 2); g.fillText('🥊', 0, 0); g.restore();
  g.globalAlpha = 1;
  g.font = '130px "Bebas Neue",Impact,sans-serif'; g.fillStyle = '#f5b82e'; g.fillText('VS', W / 2, 150);

  g.textBaseline = 'alphabetic'; g.direction = 'rtl'; g.textAlign = 'center';
  g.fillStyle = '#f2ead8'; g.font = '900 78px Cairo, sans-serif';
  g.fillText(s.title, W / 2, 330, W - 340);
  g.fillStyle = '#9aa3c2'; g.font = '700 40px Cairo, sans-serif';
  g.fillText((s.type === 'weekly' ? 'جدول أسبوعي' : 'جدول يومي') + (s.dateOrWeek ? ' — ' + s.dateOrWeek : ''), W / 2, 400, W - 340);

  const x0 = 210, tw = W - 420;
  its.forEach((i, k) => {
    const y = tableTop + k * rowH, st = inMe ? statusOf(s, i, me.id) : null;
    g.fillStyle = 'rgba(14,18,32,.88)'; rr(g, x0, y, tw, rowH - 14, 22); g.fill();
    g.strokeStyle = st === 'done' ? 'rgba(47,191,113,.8)' : st === 'late' || st === 'doneLate' ? 'rgba(229,50,45,.85)' : 'rgba(245,184,46,.55)';
    g.lineWidth = 3; rr(g, x0, y, tw, rowH - 14, 22); g.stroke();
    const cy = y + (rowH - 14) / 2;
    g.textBaseline = 'middle';
    g.direction = 'rtl'; g.textAlign = 'left'; g.fillStyle = '#f5b82e'; g.font = '900 ' + (s.type === 'weekly' ? 34 : 44) + 'px Cairo, sans-serif';
    g.fillText((s.type === 'weekly' ? dayName(s, i) + ' ' : '') + (i.time || ''), x0 + 26, cy, 230);
    g.textAlign = 'right'; g.fillStyle = '#f2ead8'; g.font = '900 44px Cairo, sans-serif';
    g.fillText(i.lesson ? `${i.subject} — ${i.lesson}` : i.subject, x0 + tw - 26, cy, tw - 380);
    g.textAlign = 'center'; g.direction = 'ltr'; g.font = '44px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.fillText(st ? ICON[st] : '⬜', x0 + 310, cy);
  });
  if (!its.length) { g.textAlign = 'center'; g.fillStyle = '#9aa3c2'; g.font = '700 44px Cairo'; g.fillText('لسه مفيش مواد', W / 2, tableTop + 60); }

  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const file = new File([blob], 'schedule.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: s.title }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'schedule.png'; a.click();
  toast('اتحمّلت الصورة 🖼');
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

if (me) enter();
</script>
